name: Build and publish site

# Runs only when someone clicks "Run workflow" in the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code (main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Build
        run: npm run build

      - name: Get the gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages-branch

      - name: Replace the site files with the new build
        run: rsync -a --delete --exclude='.git' dist/ pages-branch/

      - name: Commit and publish
        working-directory: pages-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed, nothing to publish."
          else
            git commit -m "Publish site from main ($(git -C .. rev-parse --short HEAD))"
            git push origin gh-pages
          fi

<!doctype html>
<html lang="he" dir="rtl">

    <title>SALON סלון</title>

    <!-- iOS: makes "הוספה למסך הבית" behave like a real app (no Safari chrome) -->

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta name="theme-color" content="#090d16" />

    <!-- iOS home-screen icon (also covers older iPhones/iPads via the sized variants) -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/apple-touch-icon-120.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-touch-icon-152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/apple-touch-icon-167.png" />

    <!-- browser tab favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />

    <!-- Android/other PWA support (bonus, doesn't affect iOS) -->
    <link rel="manifest" href="/manifest.webmanifest" />
